name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # the e2e suite (~380 tests, one worker) took ~43 min in one job and hit the 45 min cap; split it over 4 runners
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.shard == 1
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # dist/ is already built by the step above, so the e2e server only serves it.
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          E2E_SKIP_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
